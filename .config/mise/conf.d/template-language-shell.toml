[task_templates."check:format:shell"]
description = "Checks all formatting enforcements for shell sources"
deny_all = true
allow_read = ["."]
allow_env = ["usage_*", "MISE_TASK_NAME"]
sources = [
  "{{ vars.extra_shell_source | default(value='') }}",
  "**/*.{bash,bats,dash,mksh,ksh,sh,zsh}",
  "!vendor/**",
  "!@gitignore",
]
usage = '''
flag "-v --verbose" help="Increase verbosity (repeat for more)" count=#true
arg "[files]" double_dash="optional" var=#true help="Sources to include in task (default: all sources)"
'''
run = '''#!/usr/bin/env sh
{% set default_script = env.MISE_TASK_NAME | replace(from=":", to="-") %}
{% set script = vars.script | default(value=default_script) %}
{% set all = task_source_files() | json_encode() %}
{% set changed = task_source_files(only_changed=true) | json_encode() %}
{% set total = (all | length) + (changed | length) %}
exec python3 -B \
  "{{ config_root }}/.config/mise/scripts/{{ script }}.py" \
  {% if all | length > 100000 %}  --sources-too-long
  {% else %}  --all-json {{ all | quote }} \
  {% if total < 120000 %}  --changed-json {{ changed | quote }}
  {% else %}  --changed all
  {% endif %}{% endif %}
'''

[task_templates."check:format:shell".tools]
python = "{{ vars.tool_version_python }}"
shfmt = "{{ vars.tool_version_shfmt }}"


[task_templates."check:lint:shell"]
description = "Checks all linting enforcements for shell sources"
depends = ["setup:shuck-cache"]
deny_all = true
allow_read = ["."]
allow_write = ["{{ config_root }}/tmp/cache"]
allow_env = ["MISE_TASK_NAME", "XDG_CACHE_HOME", "usage_*"]
env = { XDG_CACHE_HOME = "{{ config_root }}/tmp/cache" }
sources = [
  "{{ vars.extra_shell_source | default(value='') }}",
  "**/*.{bash,bats,dash,mksh,ksh,sh,zsh}",
  "!vendor/**",
  "!@gitignore",
  "{% if (config_root ~ '/shuck.toml') is file %}shuck.toml{% endif %}",
]
usage = '''
flag "-v --verbose" help="Increase verbosity (repeat for more)" count=#true
arg "[files]" double_dash="optional" var=#true help="Sources to include in task (default: all sources)"
'''
run = '''#!/usr/bin/env sh
{% set default_script = env.MISE_TASK_NAME | replace(from=":", to="-") %}
{% set script = vars.script | default(value=default_script) %}
{% set all = task_source_files() | json_encode() %}
{% set changed = task_source_files(only_changed=true) | json_encode() %}
{% set total = (all | length) + (changed | length) %}
exec python3 -B \
  "{{ config_root }}/.config/mise/scripts/{{ script }}.py" \
  {% if all | length > 100000 %}  --sources-too-long
  {% else %}  --all-json {{ all | quote }} \
  {% if total < 120000 %}  --changed-json {{ changed | quote }}
  {% else %}  --changed all
  {% endif %}{% endif %}
'''

[task_templates."check:lint:shell".tools]
"cargo:shuck-cli" = "{{ vars.tool_version_shuck }}"
python = "{{ vars.tool_version_python }}"


[task_templates."test:shell"]
description = "Runs all tests for shell sources"
depends = ["test:shell:*"]


[task_templates."test:shell:shunit2"]
description = "Runs all tests for shell sources with shUnit2"
allow_env = ["usage_*", "MISE_TASK_NAME"]
allow_read = ["."]
# Everything is denied except network access (`deny_all` cannot be partly
# undone, and `allow_net` only accepts hosts, which no platform supports).
#
# NOTE: tasks extended from this template that do not require net access should
# explicitly set `deny_net = true`, such as for true unit tests
deny_env = true
deny_read = true
deny_unix = true
deny_write = true
sources = [
  "{{ vars.extra_shell_source | default(value='') }}",
  "**/*.{bash,bats,dash,mksh,ksh,sh,zsh}",
  "!vendor/**",
  "!@gitignore",
]
usage = '''
flag "-v --verbose" help="Increase verbosity (repeat for more)" count=#true
arg "[files]" double_dash="optional" var=#true help="Sources to include in task (default: all sources)"
'''
run = '''#!/usr/bin/env sh
{% set default_script = env.MISE_TASK_NAME | replace(from=":", to="-") %}
{% set script = vars.script | default(value=default_script) %}
{% set all = task_source_files() | json_encode() %}
{% set changed = task_source_files(only_changed=true) | json_encode() %}
{% set total = (all | length) + (changed | length) %}
exec python3 -B \
  "{{ config_root }}/.config/mise/scripts/{{ script }}.py" \
  {% if all | length > 100000 %}  --sources-too-long
  {% else %}  --all-json {{ all | quote }} \
  {% if total < 120000 %}  --changed-json {{ changed | quote }}
  {% else %}  --changed all
  {% endif %}{% endif %}
'''

[task_templates."test:shell:shunit2".tools]
jq = "{{ vars.tool_version_jq }}"
python = "{{ vars.tool_version_python }}"


[task_templates."clean:shell:shunit2"]
description = "Cleans up shell project files generated by shUnit2"
deny_all = true
allow_read = ["."]
allow_write = ["."]
allow_env = ["usage_*", "MISE_TASK_NAME"]
vars = { script = "clean" }
usage = '''
flag "-n --dry-run" help="Show what would be removed"
flag "-v --verbose" help="Increase verbosity (repeat for more)" count=#true
arg "[paths]" help="Globs to remove" var=#true default="tmp"
'''
run = '''#!/usr/bin/env sh
{% set default_script = env.MISE_TASK_NAME | replace(from=":", to="-") %}
{% set script = vars.script | default(value=default_script) %}
exec python3 -B "{{ config_root }}/.config/mise/scripts/{{ script }}.py"
'''

[task_templates."clean:shell:shunit2".tools]
python = "{{ vars.tool_version_python }}"


[task_templates."setup:shuck-cache"]
description = "Creates the directory that shuck writes its cache to (tmp/cache)"
deny_all = true
allow_read = ["."]
allow_write = ["."]
allow_env = ["usage_*", "MISE_TASK_NAME"]
vars = { script = "mkdir" }
usage = '''
flag "-n --dry-run" help="Show what would be created"
flag "-v --verbose" help="Increase verbosity (repeat for more)" count=#true
arg "[paths]" help="Directories to create" var=#true default="{{ config_root }}/tmp/cache"
'''
run = '''#!/usr/bin/env sh
{% set default_script = env.MISE_TASK_NAME | replace(from=":", to="-") %}
{% set script = vars.script | default(value=default_script) %}
exec python3 -B "{{ config_root }}/.config/mise/scripts/{{ script }}.py"
'''

[task_templates."setup:shuck-cache".tools]
python = "{{ vars.tool_version_python }}"
